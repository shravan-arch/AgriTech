<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#05633a" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="leafGrad2" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#6ee7b7" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c2419" />
      <stop offset="100%" stop-color="#05140d" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      @keyframes pulseNode {
        0%, 100% { transform: scale(1); opacity: 0.85; }
        50% { transform: scale(1.3); opacity: 1; filter: drop-shadow(0 0 4px #34d399); }
      }
      @keyframes sunPulse {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.1); opacity: 1; filter: drop-shadow(0 0 5px #f59e0b); }
      }
      .circuit-node { transform-origin: center; animation: pulseNode 2.6s ease-in-out infinite; }
      .sun-pulse { transform-origin: 47px 15px; animation: sunPulse 3.2s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Modern Squircle Background Tile -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#10b981" stroke-width="1.8" stroke-opacity="0.35" />

  <!-- Precision Agriculture Elevation Contour Grid -->
  <path d="M10 49 Q32 45 54 49" stroke="#10b981" stroke-opacity="0.22" stroke-width="1.2" fill="none" />
  <path d="M8 55 Q32 51 56 55" stroke="#10b981" stroke-opacity="0.16" stroke-width="1.2" fill="none" />

  <!-- Tech Sun / Telemetry Pulse -->
  <circle class="sun-pulse" cx="47" cy="15" r="5.5" fill="url(#sunGrad)" />
  <circle cx="47" cy="15" r="8.5" stroke="#fcd34d" stroke-opacity="0.4" stroke-width="1" stroke-dasharray="2 2" fill="none" />

  <!-- Growing Smart Sprout Stem -->
  <path d="M32 50 C32 38 31 29 27 21" stroke="#34d399" stroke-width="2.6" stroke-linecap="round" fill="none" />

  <!-- Lush Organic Leaf -->
  <path d="M30 33 C20 31 14 23 16 15 C23 15 29 22 30 33 Z" fill="url(#leafGrad)" filter="url(#glow)" />

  <!-- Precision Sensor Leaf -->
  <path d="M31 27 C40 23 48 27 48 35 C40 37 33 33 31 27 Z" fill="url(#leafGrad2)" filter="url(#glow)" />

  <!-- Telemetry Sensor Circuit Lines & Nodes -->
  <path d="M22 25 L16 22 L11 25" stroke="#6ee7b7" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.85" />
  <circle class="circuit-node" cx="11" cy="25" r="2.2" fill="#34d399" />

  <path d="M39 31 L45 35 L51 33" stroke="#6ee7b7" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.85" />
  <circle class="circuit-node" cx="51" cy="33" r="2.2" fill="#fbbf24" style="animation-delay: 1.3s;" />

  <!-- Ground Soil Sensor Node -->
  <circle cx="32" cy="49" r="2.5" fill="#10b981" />
  <circle cx="32" cy="49" r="4.5" stroke="#34d399" stroke-opacity="0.5" stroke-width="1" fill="none" />
</svg>